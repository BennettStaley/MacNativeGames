name: Shader list contribution (Breath of the Wild)
description: Send the shaders your Breath of the Wild met that its shared shader list does not have yet.
title: "Shader list (Breath of the Wild): "
labels: ["shader-list-botw"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! The file holds shader keys and bind states only: no game data, saves or personal information. Once merged into [the game's shared list](https://github.com/ly05010419/MacNativeGames/blob/main/docs/shader-list.md) (`games/botw/assets/shader_list.tsv`), these shaders come with everyone's next build.
  - type: dropdown
    id: version
    attributes:
      label: Game version
      options: ["1.6.0"]
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: shader-list-contribution.txt
      description: |
        Drag the file here: `~/Library/Application Support/MacNativeGames/BotW/shader-list-contribution.txt` (the reminder shows it in Finder).
      placeholder: Drop shader-list-contribution.txt here
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Where you played (optional)
      placeholder: e.g. the Great Plateau, Kakariko, 2 hours
