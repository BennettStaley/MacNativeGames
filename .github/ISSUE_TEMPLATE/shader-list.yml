name: Shader list contribution
description: Send the shaders your game met that the shared shader list does not have yet.
title: "Shader list: "
labels: ["shader-list"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! The file holds shader keys and bind states only: no game data, saves or personal information. Once merged into [the shared list](https://github.com/ly05010419/MacNativeGames/blob/main/docs/shader-list.md), these shaders come with everyone's next build.
  - type: dropdown
    id: version
    attributes:
      label: Game version
      options: ["1.4.3", "1.2.1", "1.1.2", "1.0.0"]
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Device
      options: ["Mac", "iPhone", "iPad"]
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: shader-list-contribution.txt
      description: |
        Drag the file here. Mac: `~/Library/Application Support/MacNativeGames/TOTK/shader-list-contribution.txt` (the reminder shows it in Finder). iPhone / iPad: Files app › On My iPhone (or iPad) › Tears of the Kingdom.
      placeholder: Drop shader-list-contribution.txt here
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Where you played (optional)
      placeholder: e.g. Hyrule Field, the Depths, 2 hours
